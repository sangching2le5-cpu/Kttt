function startTest(main, count, pool){
  const n = count==='all' ? pool.length : Math.min(Number(count), pool.length);
  const qs = pick(pool, n);
  const testBody = main.querySelector('#testBody');
  main.querySelector('#testSetup').classList.add('hidden');

  testBody.innerHTML = `
  <div class="card">
    <div class="row">
      <h2 style="margin:0">Bài kiểm tra: ${n} câu</h2>
      <div class="spacer"></div>
      <button class="btn small ghost" id="testCancel">← Đổi cấu hình</button>
    </div>
    <div class="progressbar" style="margin-top:10px"><div id="testProg" style="width:0%"></div></div>
    <div class="note" id="testProgTxt" style="margin-top:5px">Đã trả lời 0/${n}</div>
  </div>
  <div id="testQs"></div>
  <div class="card">
    <button class="btn primary" id="submitTest">📤 Nộp bài</button>
    <span class="note" style="margin-left:10px">Đáp án và giải thích sẽ hiện sau khi nộp.</span>
  </div>
  <div id="testResult"></div>`;

  const qWrap = testBody.querySelector('#testQs');
  qWrap.innerHTML = qs.map((q,i)=>{
    if(q.type==='mc'){
      return `<div class="qbox" data-tq="${i}">
        <div class="qtext">Câu ${i+1}. ${q.prompt} <span class="tag grey">Unit ${q.unit}</span></div>
        ${q.options.map((o,j)=>`<button class="opt" data-topt="${i}" data-toj="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}
      </div>`;
    }
    return `<div class="qbox" data-tq="${i}">
      <div class="qtext">Câu ${i+1}. ${q.prompt} <span class="tag grey">Unit ${q.unit}</span></div>
      <input type="text" data-ttext="${i}" placeholder="Nhập câu trả lời...">
    </div>`;
  }).join('');

  const answers = new Array(qs.length).fill(null);
  function updateProgress(){
    const done = answers.filter(a=>a!==null && a!=='').length;
    testBody.querySelector('#testProg').style.width = Math.round(done/qs.length*100)+'%';
    testBody.querySelector('#testProgTxt').textContent = `Đã trả lời ${done}/${qs.length}`;
  }
  qWrap.querySelectorAll('[data-topt]').forEach(b=>{
    b.addEventListener('click',()=>{
      const i=Number(b.dataset.topt), j=Number(b.dataset.toj);
      const qbox=b.closest('.qbox');
      qbox.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      answers[i]=qs[i].options[j];
      updateProgress();
    });
  });
  qWrap.querySelectorAll('[data-ttext]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      answers[Number(inp.dataset.ttext)] = inp.value;
      updateProgress();
    });
  });

  testBody.querySelector('#testCancel').addEventListener('click',()=>showView('test'));

  testBody.querySelector('#submitTest').addEventListener('click',()=>{
    if(!confirm('Bạn có chắc muốn nộp bài?')) return;
    let correct=0;
    const unitPerf={};
    const details=[];
    qs.forEach((q,i)=>{
      const ua = answers[i];
      let good=false;
      if(q.type==='mc') good = ua===q.answer;
      // ✅ FIX #1d: dùng enMatch cho text – hỗ trợ "supply / supplies", "noun, verb"...
      else good = ua!=null && q.accept.some(a=>enMatch(ua, a));
      if(good) correct++;
      if(!unitPerf[q.unit]) unitPerf[q.unit]={c:0,t:0};
      unitPerf[q.unit].t++;
      if(good) unitPerf[q.unit].c++;
      recordUnit(q.unit, good);
      if(!good){
        addMistake({key:q.key, unit:q.unit, type:q.type==='mc'?'mc':'text',
          prompt:q.prompt, user: ua||'(bỏ trống)', correct:q.answer, explanation:q.explanation});
      }
      details.push({q, ua, good});
    });

    /* Hiển thị đáp án đúng/sai */
    qs.forEach((q,i)=>{
      const qbox = qWrap.querySelector(`.qbox[data-tq="${i}"]`);
      if(q.type==='mc'){
        qbox.querySelectorAll('.opt').forEach(b=>{
          const j=Number(b.dataset.toj);
          b.classList.remove('sel');
          if(q.options[j]===q.answer) b.classList.add('correct');
          else if(answers[i]===q.options[j]) b.classList.add('wrong');
        });
      } else {
        const inp=qbox.querySelector('input');
        inp.disabled=true;
        inp.style.borderColor = details[i].good?'var(--ok)':'var(--err)';
      }
      const fb=document.createElement('div');
      fb.className='feedback show '+(details[i].good?'ok':'err');
      fb.innerHTML = (details[i].good?'✅ Đúng. ':'❌ Sai. ') +
        `Đáp án: <b>${esc(q.answer)}</b><br>${q.explanation}`;
      qbox.appendChild(fb);
    });
    testBody.querySelector('#submitTest').disabled=true;
    testBody.querySelector('#submitTest').textContent='Đã nộp bài';

    const pct = Math.round(correct/qs.length*100);
    state.testScores.push({ts:Date.now(), pct, correct, total:qs.length});
    if(state.testScores.length>30) state.testScores.shift();
    logActivity(`Làm bài kiểm tra ${qs.length} câu – đúng ${correct} (${pct}%)`);
    saveState();

    let unitRows = Object.keys(unitPerf).sort((a,b)=>Number(a)-Number(b)).map(u=>{
      const p=unitPerf[u];
      return `<div class="kv"><span>Unit ${u} – ${esc(unitName(u).replace('Unit '+u+' – ',''))}</span>
        <span><b>${p.c}/${p.t}</b> (${Math.round(p.c/p.t*100)}%)</span></div>`;
    }).join('');

    lastTestResult = {qs, answers};

    testBody.querySelector('#testResult').innerHTML = `
    <div class="card" style="border-color:var(--primary)">
      <h2>📊 Kết quả</h2>
      <div class="grid stats">
        <div class="stat"><div class="num">${correct}/${qs.length}</div><div class="lbl">Số câu đúng</div></div>
        <div class="stat"><div class="num">${pct}%</div><div class="lbl">Độ chính xác</div></div>
        <div class="stat"><div class="num">${qs.length-correct}</div><div class="lbl">Số câu sai</div></div>
      </div>
      <h3>Kết quả theo từng bài</h3>
      ${unitRows}
      <h3>Giải thích chi tiết</h3>
      <div style="max-height:420px;overflow:auto">
      ${details.map((d,i)=>{
        const q=d.q;
        return `<div class="list-item">
          <b>Câu ${i+1} (Unit ${q.unit}):</b> ${q.prompt}<br>
          <span class="${d.good?'':'note'}">Bạn trả lời: <b>${esc(d.ua||'(bỏ trống)')}</b></span><br>
          <span style="color:var(--ok)">Đáp án: <b>${esc(q.answer)}</b></span><br>
          <span class="note">${q.explanation}</span>
        </div>`;
      }).join('')}
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="retryWrong">🔁 Làm lại chỉ câu sai</button>
        <button class="btn" id="newTest">🆕 Bài kiểm tra mới</button>
      </div>
      <p class="note" style="margin-top:8px">Tiến độ 9 câu hỏi tự luận được theo dõi riêng ở mục “Câu hỏi tự luận”, không tính vào điểm bài kiểm tra này.</p>
    </div>`;

    testBody.querySelector('#newTest').addEventListener('click',()=>showView('test'));
    testBody.querySelector('#retryWrong').addEventListener('click',()=>{
      const wrong = details.filter(d=>!d.good).map(d=>d.q);
      if(!wrong.length){ toast('Bạn không có câu sai nào! 🎉'); return; }
      testBody.innerHTML='';
      main.querySelector('#testSetup').classList.remove('hidden');
      startTest(main, 'all', wrong);
    });
    testBody.querySelector('#testResult').scrollIntoView({behavior:'smooth'});
  });
  updateProgress();
}

function renderProgress(main){
  const acc = state.totalAnswered ? Math.round(state.totalCorrect/state.totalAnswered*100) : 0;
  const notMastered = state.mistakes.filter(m=>!m.mastered);

  let unitRows='';
  UNITS.forEach(u=>{
    const s = state.unitStats[String(u.id)] || {c:0,t:0};
    const p = s.t ? Math.round(s.c/s.t*100) : 0;
    unitRows += `<div class="unitrow">
      <div class="top"><span>Unit ${u.id} – ${esc(u.name)}</span><span>${s.c}/${s.t} (${p}%)</span></div>
      <div class="progressbar"><div style="width:${p}%"></div></div>
    </div>`;
  });

  const scores = state.testScores.slice().reverse().slice(0,10).map(s=>
    `<div class="kv"><span>${new Date(s.ts).toLocaleString('vi-VN')}</span><span><b>${s.correct}/${s.total}</b> (${s.pct}%)</span></div>`
  ).join('') || '<div class="note">Chưa có bài kiểm tra nào.</div>';

  main.innerHTML = `
  <h1>📈 Tiến độ &amp; Lỗi sai</h1>

  <div class="card">
    <h2>Tổng quan</h2>
    <div class="grid stats">
      <div class="stat"><div class="num">${learnedCount()}/${VOCAB.length}</div><div class="lbl">Từ đã học</div></div>
      <div class="stat"><div class="num">${acc}%</div><div class="lbl">Độ chính xác chung</div></div>
      <div class="stat"><div class="num">${notMastered.length}</div><div class="lbl">Lỗi chưa khắc phục</div></div>
      <div class="stat"><div class="num">${Object.keys(state.openDone).length}/9</div><div class="lbl">Câu tự luận đã lưu</div></div>
    </div>
    <h3>Độ chính xác theo bài</h3>
    ${unitRows}
  </div>

  <div class="card">
    <h2>📝 Lịch sử bài kiểm tra (10 lần gần nhất)</h2>
    ${scores}
  </div>

  <div class="card">
    <h2>❌ Ôn lại lỗi sai (${notMastered.length})</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="btn small" id="hideMastered">👁️ Hiện cả lỗi đã khắc phục</button>
      <button class="btn small danger" id="clearMistakes">🗑️ Xoá danh sách lỗi</button>
    </div>
    <div id="mistakeList"></div>
  </div>

  <div class="card">
    <h2>💾 Sao lưu &amp; phục hồi</h2>
    <div class="row">
      <button class="btn primary small" id="exportBtn">⬇️ Export Progress (JSON)</button>
      <label class="btn small" style="cursor:pointer">⬆️ Import Progress
        <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      </label>
      <button class="btn danger small" id="resetAll">🗑️ Xoá toàn bộ tiến độ</button>
    </div>
    <p class="note" style="margin-top:8px">Tệp xuất ra chứa toàn bộ tiến độ học tập và câu trả lời tự luận của bạn.
    Dữ liệu chỉ được lưu trên thiết bị này, không gửi lên máy chủ.</p>
  </div>`;

  let showMastered=false;
  function drawMistakes(){
    const list = showMastered ? state.mistakes : state.mistakes.filter(m=>!m.mastered);
    const el = main.querySelector('#mistakeList');
    if(!list.length){ el.innerHTML='<div class="note">Không có lỗi sai nào. Tuyệt vời! 🎉</div>'; return; }
    el.innerHTML = list.map((m,idx)=>{
      const realIdx = state.mistakes.indexOf(m);
      return `<div class="list-item" data-midx="${realIdx}">
        <div><span class="tag grey">Unit ${m.unit||'-'}</span> <span class="tag">${esc(m.type||'')}</span>
        ${m.mastered?'<span class="tag green">Đã khắc phục</span>':''}</div>
        <div style="margin:6px 0"><b>Câu hỏi:</b> ${m.prompt}</div>
        <div>Bạn trả lời: <b style="color:var(--err)">${esc(m.user)}</b></div>
        <div>Đáp án đúng: <b style="color:var(--ok)">${esc(m.correct)}</b></div>
        <div class="note" style="margin-top:4px">${esc(m.explanation||'')}</div>
        <div class="row" style="margin-top:8px">
          <button class="btn small" data-retry="${realIdx}">🔁 Thử lại</button>
          <button class="btn small ${m.mastered?'':'primary'}" data-master="${realIdx}">${m.mastered?'↩️ Bỏ đánh dấu':'✅ Đã khắc phục'}</button>
        </div>
        <div id="retryBox-${realIdx}" style="margin-top:8px"></div>
      </div>`;
    }).join('');

    el.querySelectorAll('[data-master]').forEach(b=>b.addEventListener('click',()=>{
      const i=Number(b.dataset.master);
      state.mistakes[i].mastered = !state.mistakes[i].mastered;
      saveState(); drawMistakes();
      toast(state.mistakes[i].mastered?'Đã đánh dấu khắc phục':'Đã bỏ đánh dấu');
    }));
    el.querySelectorAll('[data-retry]').forEach(b=>b.addEventListener('click',()=>{
      const i=Number(b.dataset.retry);
      const m=state.mistakes[i];
      const box = el.querySelector('#retryBox-'+i);
      box.innerHTML = `<input type="text" id="rt-${i}" placeholder="Nhập lại câu trả lời...">
        <div class="row" style="margin-top:6px">
          <button class="btn small primary" id="rtc-${i}">Kiểm tra</button>
          <button class="btn small" id="rts-${i}">Xem đáp án</button>
        </div>
        <div class="feedback" id="rtf-${i}"></div>`;
      box.querySelector('#rts-'+i).addEventListener('click',()=>{
        const fb=box.querySelector('#rtf-'+i);
        fb.className='feedback show info';
        fb.innerHTML=`Đáp án đúng: <b>${esc(m.correct)}</b><br>${esc(m.explanation||'')}`;
      });
      box.querySelector('#rtc-'+i).addEventListener('click',()=>{
        const val=box.querySelector('#rt-'+i).value;
        // ✅ FIX #1e: dùng enMatch cho trường hợp đáp án tiếng Anh có biến thể "/"
        const good = norm(val)===norm(m.correct) || viMatch(val, m.correct) || enMatch(val, m.correct);
        const fb=box.querySelector('#rtf-'+i);
        fb.className='feedback show '+(good?'ok':'err');
        if(good){
          fb.innerHTML = `✅ Chính xác! Bạn đã khắc phục được lỗi này.`;
          m.mastered=true; saveState();
        }else{
          fb.innerHTML = `❌ Chưa đúng. Đáp án đúng: <b>${esc(m.correct)}</b><br>${esc(m.explanation||'')}`;
        }
      });
    }));
  }
  drawMistakes();

  main.querySelector('#hideMastered').addEventListener('click',()=>{ showMastered=!showMastered; drawMistakes(); });
  main.querySelector('#clearMistakes').addEventListener('click',()=>{
    if(confirm('Xoá toàn bộ danh sách lỗi sai?')){ state.mistakes=[]; saveState(); drawMistakes(); toast('Đã xoá danh sách lỗi.'); }
  });

  main.querySelector('#exportBtn').addEventListener('click',()=>{
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download='office-english-progress-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Đã xuất tệp tiến độ.');
  });

  main.querySelector('#importFile').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        if(!obj || typeof obj!=='object' || !('learned' in obj) || !('mistakes' in obj)){
          alert('Tệp không hợp lệ: thiếu cấu trúc dữ liệu tiến độ.');
          return;
        }
        if(!confirm('Nhập tiến độ từ tệp sẽ GHI ĐÈ tiến độ hiện tại. Bạn có chắc chắn?')) return;
        state = Object.assign(defaultState(), obj);
        if(!Array.isArray(state.mistakes)) state.mistakes=[];
        if(!Array.isArray(state.activity)) state.activity=[];
        if(!Array.isArray(state.testScores)) state.testScores=[];
        saveState(); refreshTopbar();
        toast('Đã nhập tiến độ thành công.');
        showView('progress');
      }catch(err){
        alert('Không đọc được tệp JSON. Vui lòng kiểm tra lại tệp đã xuất.');
      }
    };
    reader.readAsText(file);
    e.target.value='';
  });

  main.querySelector('#resetAll').addEventListener('click',()=>{
    if(confirm('Bạn có chắc muốn xoá toàn bộ tiến độ? Hành động này không thể hoàn tác.')){
      state=defaultState(); saveState(); refreshTopbar(); showView('dashboard');
      toast('Đã xoá toàn bộ tiến độ.');
    }
  });
}

/* =========================================================================
   14. SỰ KIỆN TOÀN CỤC & KHỞI ĐỘNG
   ========================================================================= */
document.addEventListener('click', e=>{
  const sp = e.target.closest('[data-speak]');
  if(sp){ speak(sp.dataset.speak); return; }

  const lb = e.target.closest('[data-learn]');
  if(lb){
    const id=Number(lb.dataset.learn);
    markLearned(id, !state.learned[id]);
    toast(state.learned[id]?'✅ Đã đánh dấu đã học':'↩️ Đã bỏ đánh dấu');
    return;
  }
  const bk = e.target.closest('[data-book]');
  if(bk){
    const id=Number(bk.dataset.book);
    if(state.bookmarked[id]) delete state.bookmarked[id]; else state.bookmarked[id]=true;
    saveState();
    bk.classList.toggle('on');
    bk.textContent = state.bookmarked[id]?'★ Đang ôn':'☆ Lưu từ khó';
    toast(state.bookmarked[id]?'⭐ Đã lưu vào danh sách từ khó':'Đã bỏ khỏi danh sách từ khó');
    return;
  }
});

$$('.sidebar a').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    showView(a.dataset.view);
  });
});
$('#menuBtn').addEventListener('click',()=>{
  if($('#sidebar').classList.contains('open')) closeSidebar(); else openSidebar();
});
$('#scrim').addEventListener('click', closeSidebar);
window.addEventListener('resize',()=>{ if(window.innerWidth>900) closeSidebar(); });

/* Khởi động */
loadState();
refreshTopbar();
showView(state.lastView && VIEWS.indexOf(state.lastView)>=0 ? state.lastView : 'dashboard');
</script>
