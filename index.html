<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office English – Học từ vựng văn phòng</title>
<style>
:root{
  --bg:#f2f7fd; --card:#ffffff; --primary:#3b7dd8; --primary-dark:#2a5fae;
  --primary-light:#e3eefb; --text:#1f2d3d; --muted:#64748b; --border:#d6e4f5;
  --ok:#1e9e6a; --ok-bg:#e6f7f0; --err:#d9534f; --err-bg:#fdeceb;
  --warn:#e8a33d; --warn-bg:#fdf3e3; --radius:14px;
  --shadow:0 1px 3px rgba(35,70,120,.07),0 6px 18px rgba(35,70,120,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
img,table{max-width:100%}
button{font-family:inherit}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:10px;
  background:linear-gradient(135deg,#3b7dd8,#5b9ae8); color:#fff;
  padding:10px 14px; box-shadow:0 2px 10px rgba(35,70,120,.15);
}
.brand{font-weight:700; font-size:1.05rem; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.pill{background:rgba(255,255,255,.2); padding:4px 10px; border-radius:999px; font-size:.78rem; white-space:nowrap}
.icon-btn{
  background:rgba(255,255,255,.18); border:none; color:#fff; font-size:1.15rem;
  width:38px; height:38px; border-radius:10px; cursor:pointer; display:grid; place-items:center;
}
.icon-btn:hover{background:rgba(255,255,255,.3)}

/* ---------- Layout ---------- */
.app{display:flex; align-items:flex-start; min-height:calc(100vh - 58px)}
.sidebar{
  width:250px; flex:0 0 250px; background:#fff; border-right:1px solid var(--border);
  padding:14px 10px; position:sticky; top:58px; height:calc(100vh - 58px); overflow-y:auto;
}
.sidebar a{
  display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:4px;
  border-radius:10px; color:var(--text); text-decoration:none; font-size:.94rem; font-weight:500;
}
.sidebar a:hover{background:var(--primary-light)}
.sidebar a.active{background:var(--primary); color:#fff}
.main{flex:1; min-width:0; padding:18px; max-width:1180px; margin:0 auto; width:100%}
.scrim{display:none}

@media(max-width:900px){
  .sidebar{
    position:fixed; left:0; top:58px; bottom:0; height:auto; z-index:70;
    transform:translateX(-105%); transition:transform .22s ease; box-shadow:var(--shadow);
  }
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block; position:fixed; inset:58px 0 0 0; background:rgba(20,40,70,.35); z-index:65}
  .main{padding:14px}
}

/* ---------- Common ---------- */
h1{font-size:1.35rem; margin:.2em 0 .6em}
h2{font-size:1.12rem; margin:1.2em 0 .5em; color:var(--primary-dark)}
h3{font-size:1rem; margin:1em 0 .4em}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px}
.grid{display:grid; gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center}
.stat .num{font-size:1.6rem; font-weight:700; color:var(--primary)}
.stat .lbl{font-size:.82rem; color:var(--muted)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 16px; border-radius:10px; border:1px solid var(--border);
  background:#fff; color:var(--text); font-size:.9rem; font-weight:600; cursor:pointer;
  min-height:42px; transition:background .15s;
}
.btn:hover{background:#f4f8fe}
.btn.primary{background:var(--primary); color:#fff; border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.ghost{background:transparent}
.btn.danger{background:#fff; color:var(--err); border-color:#f2c4c1}
.btn.danger:hover{background:var(--err-bg)}
.btn.small{padding:6px 10px; font-size:.8rem; min-height:34px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.spacer{flex:1}
input[type=text],input[type=search],textarea,select{
  font-family:inherit; font-size:.92rem; padding:9px 11px; border:1px solid var(--border);
  border-radius:10px; background:#fff; color:var(--text); width:100%; max-width:100%;
}
textarea{min-height:90px; resize:vertical; line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-light); border-color:var(--primary)}
label.field{display:block; margin-bottom:10px; font-size:.86rem; color:var(--muted); font-weight:600}
.tag{display:inline-block; background:var(--primary-light); color:var(--primary-dark); font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px}
.tag.grey{background:#eef2f7; color:var(--muted)}
.tag.green{background:var(--ok-bg); color:var(--ok)}
.tag.orange{background:var(--warn-bg); color:#a9701a}
.note{font-size:.82rem; color:var(--muted)}
.passage{background:#fbfdff; border-left:4px solid var(--primary); border-radius:0 10px 10px 0; padding:14px 16px; line-height:1.75}
.passage p{margin:.6em 0}
.passage h3{margin-top:0; color:var(--primary-dark)}
.passage ul{margin:.5em 0 .5em 1.1em}
.progressbar{height:9px; background:#e8eff8; border-radius:999px; overflow:hidden; margin-top:6px}
.progressbar > div{height:100%; background:linear-gradient(90deg,#4f92e8,#3b7dd8); border-radius:999px; transition:width .3s}
.unitrow{margin-bottom:10px}
.unitrow .top{display:flex; justify-content:space-between; font-size:.86rem; font-weight:600}
.feedback{margin-top:10px; font-size:.9rem; border-radius:10px; padding:10px 12px; display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg); color:#136b48; border:1px solid #b9e6d3}
.feedback.err{background:var(--err-bg); color:#8f2f2b; border:1px solid #f3c8c5}
.feedback.info{background:var(--primary-light); color:var(--primary-dark); border:1px solid #c3dbf7}
.qbox{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff}
.qbox .qtext{font-weight:600; margin-bottom:8px; font-size:.94rem}
.opt{display:block; width:100%; text-align:left; border:1px solid var(--border); background:#fff; border-radius:10px; padding:9px 12px; margin-bottom:6px; cursor:pointer; font-size:.9rem}
.opt:hover{background:#f4f8fe}
.opt.sel{border-color:var(--primary); background:var(--primary-light)}
.opt.correct{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--err); background:var(--err-bg)}
.vcard{border:1px solid var(--border); border-radius:12px; padding:13px; background:#fff; margin-bottom:10px}
.vcard.learned{border-color:#b9e6d3; background:#fbfffd}
.vhead{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:baseline}
.vword{font-weight:700; font-size:1.03rem; color:var(--primary-dark)}
.vpos{font-size:.78rem; color:var(--muted); font-style:italic; margin-left:6px}
.ipa{font-size:.84rem; color:var(--muted)}
.vvi{color:#14507f; font-weight:600; margin:4px 0}
.vex{font-size:.87rem; color:#3c4a5c; background:#f8fbff; border-radius:8px; padding:8px 10px; margin-top:6px}
.vfoot{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; align-items:center}
.mini{border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; color:var(--text)}
.mini:hover{background:#f4f8fe}
.mini.on{background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark)}
body.hide-vi-mode .hide-vi{display:none}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:8px 0}
.chip{border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 13px; font-size:.83rem; cursor:pointer; font-weight:600}
.chip:hover{background:#f4f8fe}
.chip.sel{background:var(--primary); color:#fff; border-color:var(--primary)}
.zone{min-height:74px; border:2px dashed var(--border); border-radius:12px; padding:9px; background:#fbfdff}
.zone.over{border-color:var(--primary); background:var(--primary-light)}
.zone h4{margin:0 0 6px; font-size:.85rem; color:var(--primary-dark)}
table{width:100%; border-collapse:collapse; font-size:.88rem}
th,td{border:1px solid var(--border); padding:8px 10px; text-align:left}
th{background:var(--primary-light); color:var(--primary-dark)}
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.matchrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px}
.matchrow .mleft{flex:1 1 190px; font-weight:600; font-size:.9rem}
.matchrow select{flex:1 1 220px}
.answerbox{background:#fbfffd; border:1px solid #b9e6d3; border-radius:10px; padding:10px 12px; font-size:.9rem; margin-top:8px}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.tab{padding:8px 13px; border-radius:999px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:.85rem; font-weight:600}
.tab.active{background:var(--primary); color:#fff; border-color:var(--primary)}
.hidden{display:none !important}
.kv{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--border); font-size:.88rem}
.kv:last-child{border-bottom:none}
.list-item{border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; background:#fff; font-size:.88rem}
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(80px);
  background:#1f2d3d; color:#fff; padding:10px 18px; border-radius:10px; font-size:.88rem;
  opacity:0; transition:.25s; z-index:200; pointer-events:none; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  .main{padding:11px}
  .card{padding:13px}
  h1{font-size:1.15rem}
  .stat .num{font-size:1.35rem}
  .btn{padding:9px 13px; font-size:.85rem}
}
</style>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Mở menu">☰</button>
  <div class="brand">💼 Office English</div>
  <div class="topbar-right">
    <span class="pill" id="topbarProgress">0/0 từ</span>
  </div>
</header>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <a href="#" data-view="dashboard">📊 Dashboard</a>
    <a href="#" data-view="vocab">📚 Thư viện từ vựng</a>
    <a href="#" data-view="units">📖 Học theo bài</a>
    <a href="#" data-view="reading">📝 Luyện đọc hiểu</a>
    <a href="#" data-view="exercises">✏️ Bài tập từ vựng</a>
    <a href="#" data-view="open">💬 Câu hỏi tự luận</a>
    <a href="#" data-view="test">🎯 Bài kiểm tra tổng hợp</a>
    <a href="#" data-view="progress">📈 Tiến độ &amp; Lỗi sai</a>
  </nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================================
   1. DỮ LIỆU
   ========================================================================= */

const UNITS = [
  {id:1,  name:"Office Supplies",              vi:"Đồ dùng văn phòng"},
  {id:2,  name:"Office Furniture",             vi:"Nội thất văn phòng"},
  {id:5,  name:"Office Documents",             vi:"Tài liệu văn phòng"},
  {id:10, name:"Qualities of a Good Employee", vi:"Phẩm chất nhân viên giỏi"},
  {id:11, name:"Departments",                  vi:"Các phòng ban"}
];

const V = (en,pos,ipa,vi,ex,exVi,units)=>({en,pos,ipa,vi,ex,exVi,units});

const VOCAB = [
/* ---------------- UNIT 1 ---------------- */
V("supply / supplies","noun","/səˈplaɪ/, /səˈplaɪz/","đồ dùng, vật tư","The secretary needs some office supplies, such as pens and folders.","Thư ký cần một số đồ dùng văn phòng như bút và bìa hồ sơ.",[1]),
V("pen","noun","/pen/","bút mực","My pen is out of ink, so I need a new one.","Bút của tôi hết mực nên tôi cần một cái mới.",[1]),
V("tape","noun","/teɪp/","băng dính","Use tape to stick the two pages together.","Dùng băng dính để dán hai trang giấy lại với nhau.",[1]),
V("folder","noun","/ˈfəʊldə(r)/","bìa đựng hồ sơ","Put these documents in a folder.","Hãy cho các tài liệu này vào bìa hồ sơ.",[1]),
V("staple","noun","/ˈsteɪpl/","ghim bấm giấy","He places an order for staples, paperclips and correction fluid.","Anh ấy đặt hàng ghim, kẹp giấy và bút xóa.",[1]),
V("paperclip","noun","/ˈpeɪpəklɪp/","kẹp giấy","A paperclip slides over papers to keep them together.","Kẹp giấy trượt qua các tờ giấy để giữ chúng lại với nhau.",[1]),
V("correction fluid","noun","/kəˈrekʃən ˌfluːɪd/","bút xóa, dung dịch xóa","She used correction fluid to cover the mistake.","Cô ấy dùng bút xóa để che lỗi sai.",[1]),
V("order","noun, verb","/ˈɔːdə(r)/","đơn đặt hàng; đặt hàng","The manager places an order for office supplies every month.","Người quản lý đặt hàng đồ dùng văn phòng mỗi tháng.",[1]),
V("in charge of","phrase","/ɪn ˈtʃɑːdʒ əv/","chịu trách nhiệm về","One person is in charge of purchasing supplies.","Một người chịu trách nhiệm mua đồ dùng văn phòng.",[1]),
V("office supply store","noun phrase","/ˈɒfɪs səˈplaɪ stɔː(r)/","cửa hàng văn phòng phẩm","Many office supply stores give discounts for larger orders.","Nhiều cửa hàng văn phòng phẩm giảm giá cho những đơn hàng lớn hơn.",[1]),
V("purchase","verb, noun","/ˈpɜːtʃəs/","mua; sự mua hàng","The company purchases supplies in large quantities.","Công ty mua đồ dùng với số lượng lớn.",[1]),
V("purchasing","noun","/ˈpɜːtʃəsɪŋ/","việc thu mua","Purchasing supplies is her main responsibility.","Thu mua đồ dùng là trách nhiệm chính của cô ấy.",[1,11]),
V("necessary","adjective","/ˈnesəsəri/","cần thiết","Pens and paper are necessary items in an office.","Bút và giấy là những vật dụng cần thiết trong văn phòng.",[1]),
V("item","noun","/ˈaɪtəm/","món đồ, mặt hàng","Everything arrives at the same time, so all the items are together.","Mọi thứ đến cùng lúc nên tất cả các mặt hàng ở cùng nhau.",[1]),
V("shipping charge","noun phrase","/ˈʃɪpɪŋ tʃɑːdʒ/","phí vận chuyển","One large order saves money on shipping charges.","Một đơn hàng lớn giúp tiết kiệm phí vận chuyển.",[1]),
V("discount","noun, verb","/ˈdɪskaʊnt/","sự giảm giá; giảm giá","We got a discount on the larger order.","Chúng tôi được giảm giá cho đơn hàng lớn hơn.",[1]),
V("place an order","phrase","/pleɪs ən ˈɔːdə(r)/","đặt hàng","Please place an order for staples and paperclips.","Hãy đặt hàng ghim và kẹp giấy.",[1]),
V("larger order","noun phrase","/ˌlɑːdʒər ˈɔːdə(r)/","đơn hàng lớn hơn","Office supply stores often give discounts for larger orders.","Các cửa hàng văn phòng phẩm thường giảm giá cho đơn hàng lớn hơn.",[1]),
V("purchase office supplies","collocation","/ˈpɜːtʃəs ˈɒfɪs səˈplaɪz/","mua đồ dùng văn phòng","It is better to have one person purchase office supplies.","Tốt hơn là để một người mua đồ dùng văn phòng.",[1]),
V("save money on shipping charges","collocation","/seɪv ˈmʌni ɒn ˈʃɪpɪŋ tʃɑːdʒɪz/","tiết kiệm phí vận chuyển","Ordering everything at once saves money on shipping charges.","Đặt mọi thứ cùng một lúc giúp tiết kiệm phí vận chuyển.",[1]),

/* ---------------- UNIT 2 ---------------- */
V("office furniture","noun phrase","/ˈɒfɪs ˌfɜːnɪtʃə(r)/","nội thất văn phòng","Bradley’s sells office furniture in Chicago.","Bradley’s bán nội thất văn phòng ở Chicago.",[2]),
V("retailer","noun","/ˈriːteɪlə(r)/","nhà bán lẻ","Bradley’s is an office furniture retailer.","Bradley’s là một nhà bán lẻ nội thất văn phòng.",[2]),
V("coat rack","noun phrase","/ˈkəʊt ræk/","giá treo áo khoác","We sell everything from coat racks to filing cabinets.","Chúng tôi bán mọi thứ từ giá treo áo đến tủ đựng hồ sơ.",[2]),
V("filing cabinet","noun phrase","/ˈfaɪlɪŋ ˌkæbɪnət/","tủ đựng hồ sơ","You organize folders in a filing cabinet.","Bạn sắp xếp các bìa hồ sơ trong tủ đựng hồ sơ.",[2]),
V("office desk","noun phrase","/ˈɒfɪs desk/","bàn làm việc văn phòng","The filing cabinet is next to my office desk.","Tủ hồ sơ ở cạnh bàn làm việc của tôi.",[2]),
V("reception desk","noun phrase","/rɪˈsepʃən desk/","quầy lễ tân","How about a new reception desk? No problem.","Còn quầy lễ tân mới thì sao? Không vấn đề gì.",[2]),
V("shelf","noun","/ʃelf/","kệ, giá","We have a large selection of shelves.","Chúng tôi có rất nhiều kệ để lựa chọn.",[2]),
V("shelves","noun (plural)","/ʃelvz/","các kệ, giá","The shelves come in wood or metal.","Các kệ có loại bằng gỗ hoặc kim loại.",[2]),
V("office chair","noun phrase","/ˈɒfɪs tʃeə(r)/","ghế văn phòng","Come in and check out our brand new line of office chairs.","Hãy đến và xem dòng ghế văn phòng mới nhất của chúng tôi.",[2]),
V("traditional","adjective","/trəˈdɪʃənəl/","truyền thống","Bradley’s offers different furniture styles, from traditional to modern.","Bradley’s cung cấp nhiều phong cách nội thất khác nhau, từ truyền thống đến hiện đại.",[2]),
V("modern","adjective","/ˈmɒdən/","hiện đại","This is my great-grandfather’s desk. It’s very modern.","Đây là bàn của ông cố tôi. Nó rất hiện đại.",[2]),
V("selection","noun","/sɪˈlekʃən/","sự lựa chọn; bộ sưu tập","We also have a large selection of shelves.","Chúng tôi cũng có rất nhiều kệ để lựa chọn.",[2]),
V("experience","noun","/ɪkˈspɪəriəns/","kinh nghiệm","With over 60 years’ experience, we know what you need.","Với hơn 60 năm kinh nghiệm, chúng tôi biết bạn cần gì.",[2,10]),
V("deliver","verb","/dɪˈlɪvə(r)/","giao hàng","We deliver to your home or office, Mondays through Fridays.","Chúng tôi giao hàng đến nhà hoặc văn phòng của bạn từ thứ Hai đến thứ Sáu.",[2]),
V("delivery charge","noun phrase","/dɪˈlɪvəri tʃɑːdʒ/","phí giao hàng","Delivery charges do apply.","Phí giao hàng vẫn được áp dụng.",[2]),
V("check out","phrasal verb","/tʃek aʊt/","xem thử, kiểm tra","Come in and check out our brand new line of office chairs.","Hãy đến và xem thử dòng ghế văn phòng mới nhất của chúng tôi.",[2]),
V("come in","phrasal verb","/kʌm ɪn/","có sẵn với nhiều loại/màu khác nhau","The shelves come in wood or metal.","Các kệ có loại bằng gỗ hoặc kim loại.",[2]),
V("office furniture retailer","collocation","/ˈɒfɪs ˌfɜːnɪtʃə ˈriːteɪlə(r)/","nhà bán lẻ nội thất văn phòng","Bradley’s is an office furniture retailer based in Chicago.","Bradley’s là một nhà bán lẻ nội thất văn phòng có trụ sở tại Chicago.",[2]),

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };
const pick = (a,n) => shuffle(a).slice(0,n);
const norm = s => String(s==null?'':s).toLowerCase()
  .replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
  .replace(/[.,!?;:"'()\[\]{}\-–—]/g,' ')
  .replace(/\s+/g,' ').trim();
const unitOf = id => UNITS.find(u=>u.id===id);
const unitName = id => { const u=unitOf(id); return u? `Unit ${u.id} – ${u.name}` : ''; };

/* ✅ FIX #1: Hàm so khớp đáp án tiếng Anh có biến thể "/" (VD: "supply / supplies").
   Cho phép chấp nhận từng biến thể riêng lẻ. */
function enMatch(user, correct){
  const u = norm(user);
  if(!u) return false;
  const c = norm(correct);
  if(u === c) return true;
  // Tách các biến thể phân tách bởi dấu "/" (có thể có khoảng trắng xung quanh)
  const parts = String(correct).split(/\s*\/\s*/).map(x=>norm(x)).filter(Boolean);
  if(parts.length > 1 && parts.some(p => u === p)) return true;
  // Nếu correct có dạng "word1 / word2" và user gõ cụm chỉ chứa 1 biến thể (>=3 ký tự)
  if(parts.length > 1 && parts.some(p => p.length>=3 && (p.includes(u) || u.includes(p)))) return true;
  return false;
}

let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('Thiết bị/trình duyệt không hỗ trợ đọc văn bản.'); return; }
  try{
    const u=new SpeechSynthesisUtterance(String(text).replace(/\//g,' '));
    u.lang='en-GB'; u.rate=.92;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    toast('🔊 Giọng đọc do thiết bị tạo – không phải audio bản ngữ.');
  }catch(e){ toast('Không thể phát âm trên thiết bị này.'); }
}

   ========================================================================= */
const LS_KEY='officeEnglishProgress_v1';

function defaultState(){
  return {
    learned:{}, bookmarked:{}, exercisesDone:{},
    openAnswers:{}, openDone:{},
    mistakes:[], activity:[], testScores:[],
    unitStats:{}, lastView:'dashboard', lastUnit:1,
    totalCorrect:0, totalAnswered:0
  };
}
let state = defaultState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const obj = JSON.parse(raw);
    if(obj && typeof obj==='object'){
      state = Object.assign(defaultState(), obj);
      if(!Array.isArray(state.mistakes)) state.mistakes=[];
      if(!Array.isArray(state.activity)) state.activity=[];
      if(!Array.isArray(state.testScores)) state.testScores=[];
    }
  }catch(e){ console.warn('Không đọc được dữ liệu đã lưu', e); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Không lưu được tiến độ', e); }
}
function logActivity(text){
  state.activity.unshift({t:text, ts:Date.now()});
  if(state.activity.length>25) state.activity.length=25;
}
function recordUnit(unit, correct){
  const k=String(unit);
  if(!state.unitStats[k]) state.unitStats[k]={c:0,t:0};
  state.unitStats[k].t++;
  if(correct) state.unitStats[k].c++;
  state.totalAnswered++;
  if(correct) state.totalCorrect++;
}
function addMistake(obj){
  const exists = state.mistakes.find(m=>m.key===obj.key && !m.mastered);
  if(!exists) state.mistakes.unshift(Object.assign({ts:Date.now(),mastered:false},obj));
  if(state.mistakes.length>200) state.mistakes.length=200;
}
function markLearned(id,val){
  if(val) state.learned[id]=true; else delete state.learned[id];
  saveState(); refreshTopbar();
}
function vocabByUnit(u){ return VOCAB.filter(v=>v.units.includes(u)); }
function learnedCount(){ return Object.keys(state.learned).length; }
function unitProgress(u){
  const list=vocabByUnit(u); if(!list.length) return 0;
  const done=list.filter(v=>state.learned[v.id]).length;
  return Math.round(done/list.length*100);
}
function refreshTopbar(){
  $('#topbarProgress').textContent = learnedCount()+'/'+VOCAB.length+' từ';
}

const VIEWS = ['dashboard','vocab','units','reading','exercises','open','test','progress'];
let currentView='dashboard';

function showView(name, opts){
  if(VIEWS.indexOf(name)<0) name='dashboard';
  currentView=name;
  state.lastView=name; saveState();
  $$('.sidebar a').forEach(a=>a.classList.toggle('active', a.dataset.view===name));
  closeSidebar();
  try{ window.scrollTo({top:0,behavior:'auto'}); }catch(e){ window.scrollTo(0,0); }
  const main=$('#main');
  main.innerHTML='';
  if(name==='dashboard') renderDashboard(main);
  else if(name==='vocab') renderVocab(main, opts);
  else if(name==='units') renderUnits(main, opts);
  else if(name==='reading') renderReading(main, opts);
  else if(name==='exercises') renderExercises(main, opts);
  else if(name==='open') renderOpen(main, opts);
  else if(name==='test') renderTest(main);
  else if(name==='progress') renderProgress(main);
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

function renderDashboard(main){
  const learned=learnedCount();
  const total=VOCAB.length;
  const exDone=Object.keys(state.exercisesDone).length;
  const acc = state.totalAnswered ? Math.round(state.totalCorrect/state.totalAnswered*100) : 0;
  const openDone=Object.keys(state.openDone).length;
  const bookmarked=Object.keys(state.bookmarked).length;

  let unitBars='';
  UNITS.forEach(u=>{
    const p=unitProgress(u.id);

            <option value="za">Z → A</option>

          </select>
        </label>
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn small" id="vToggleVi">👁️ Ẩn / hiện tiếng Việt</button>
      <button class="btn small" id="vRandom">🎲 Ôn từ ngẫu nhiên</button>
      <button class="btn small" id="vPractice">🔁 Luyện tập Anh↔Việt</button>
      <button class="btn small" id="vBookmarked">⭐ Chỉ hiện từ khó</button>
      <button class="btn small" id="vLearned">✅ Chỉ hiện từ chưa học</button>

  <div id="vPracticeBox"></div>

  const listEl = main.querySelector('#vList');
  const countEl = main.querySelector('#vCount');

  let onlyBookmarked=false, onlyUnlearned=false;

  function draw(){
    let list = VOCAB.slice();
    if(unitF!=='all') list = list.filter(v=>v.units.includes(Number(unitF)));
    if(posF!=='all')  list = list.filter(v=>v.pos===posF);
    if(onlyBookmarked) list = list.filter(v=>state.bookmarked[v.id]);
    if(onlyUnlearned)  list = list.filter(v=>!state.learned[v.id]);
    const nq = norm(query);
    if(nq){
      list = list.filter(v => norm(v.en).includes(nq) || norm(v.vi).includes(nq));
    }
    if(sortMode==='az') list.sort((a,b)=>a.en.localeCompare(b.en,'en'));
    else if(sortMode==='za') list.sort((a,b)=>b.en.localeCompare(a.en,'en'));
    else list.sort((a,b)=>a.units[0]-b.units[0] || a.en.localeCompare(b.en,'en'));

    countEl.textContent = `Hiển thị ${list.length} / ${VOCAB.length} mục từ vựng.`;

    listEl.innerHTML = list.map(v=>vocabCardHTML(v)).join('');
  }

  $('#vUnit').addEventListener('change', e=>{ unitF=e.target.value; draw(); });
  $('#vPos').addEventListener('change', e=>{ posF=e.target.value; draw(); });
  $('#vSort').addEventListener('change', e=>{ sortMode=e.target.value; draw(); });
  $('#vToggleVi').addEventListener('click', ()=>{
    document.body.classList.toggle('hide-vi-mode');
    toast(document.body.classList.contains('hide-vi-mode')?'Đã ẩn tiếng Việt':'Đã hiện tiếng Việt');

  });
  $('#vBookmarked').addEventListener('click', e=>{
    onlyBookmarked=!onlyBookmarked; e.target.classList.toggle('on',onlyBookmarked); draw();
  });
  $('#vLearned').addEventListener('click', e=>{
    onlyUnlearned=!onlyUnlearned; e.target.classList.toggle('on',onlyUnlearned); draw();
  });
  $('#vPractice').addEventListener('click', ()=>{ renderRecallPractice(main.querySelector('#vPracticeBox')); });

  draw();
}

function renderRecallPractice(box){
  box.innerHTML = `

    </div>

  </div>`;
  box.querySelector('#rpClose').addEventListener('click',()=>box.innerHTML='');
  box.querySelector('#rpEnVi').addEventListener('click',()=>recallRound(box,'en2vi'));
  box.querySelector('#rpViEn').addEventListener('click',()=>recallRound(box,'vi2en'));

function recallRound(box,mode){
  const v = VOCAB[Math.floor(Math.random()*VOCAB.length)];
  const body = box.querySelector('#rpBody');
  const promptHTML = mode==='en2vi'
    ? `<div class="qtext">Từ tiếng Anh: <b>${esc(v.en)}</b> ${esc(v.ipa)} <button class="mini" data-speak="${esc(v.en)}">🔊</button><br>Hãy viết nghĩa tiếng Việt:</div>`
    : `<div class="qtext">Nghĩa tiếng Việt: <b>${esc(v.vi)}</b><br>Hãy viết từ/cụm tiếng Anh:</div>`;
  body.innerHTML = `${promptHTML}
    <input type="text" id="rpInput" placeholder="Nhập câu trả lời...">
    <div class="row" style="margin-top:8px">
      <button class="btn primary small" id="rpCheck">Kiểm tra</button>
      <button class="btn small" id="rpShow">Xem đáp án</button>
      <button class="btn small ghost" id="rpNext">Câu khác →</button>
    </div>
    <div class="feedback" id="rpFb"></div>`;
  const fb = body.querySelector('#rpFb');
  body.querySelector('#rpNext').addEventListener('click',()=>recallRound(box,mode));
  body.querySelector('#rpShow').addEventListener('click',()=>{
    fb.className='feedback show info';
    fb.innerHTML = mode==='en2vi'
      ? `Đáp án: <b>${esc(v.vi)}</b>`
      : `Đáp án: <b>${esc(v.en)}</b> ${esc(v.ipa)}`;
  });
  body.querySelector('#rpCheck').addEventListener('click',()=>{
    const ans = body.querySelector('#rpInput').value;
    if(!ans.trim()){ toast('Hãy nhập câu trả lời.'); return; }
    let ok;
    // ✅ FIX #1b: dùng enMatch thay vì so khớp cứng (hỗ trợ "supply / supplies")
    if(mode==='vi2en') ok = enMatch(ans, v.en);
    else ok = viMatch(ans, v.vi);
    recordUnit(v.units[0], ok);
    if(ok){
      fb.className='feedback show ok';
      fb.innerHTML = `✅ Chính xác! <b>${esc(v.en)}</b> ${esc(v.ipa)} – ${esc(v.vi)}`;
      logActivity('Luyện tập Anh↔Việt: đúng "'+v.en+'"');
    }else{
      fb.className='feedback show err';
      fb.innerHTML = `❌ Chưa đúng. Đáp án: <b>${mode==='en2vi'?esc(v.vi):esc(v.en)}</b><br><span class="note">Hãy thử lại hoặc bấm “Câu khác”.</span>`;
      addMistake({key:'recall-'+mode+'-'+v.id, unit:v.units[0], type:'recall',
        prompt: mode==='en2vi'? `Nghĩa tiếng Việt của "${v.en}"` : `Từ tiếng Anh của "${v.vi}"`,
        user: ans, correct: mode==='en2vi'? v.vi : v.en,
        explanation:`${v.en} ${v.ipa} = ${v.vi}. Ví dụ: ${v.ex}`});
    }
    saveState(); refreshTopbar();
  });
}
function viMatch(user, vi){
  const u = norm(user);
  if(!u) return false;
  if(u===norm(vi)) return true;
  const stop = ['của','và','các','một','sự','việc','để','trong','với','về','là','cho','có','ra','lên','bằng','những','người','được'];
  const words = norm(vi).split(' ').filter(w=>w.length>2 && stop.indexOf(w)<0);
  if(!words.length) return norm(vi).includes(u);
  const hit = words.filter(w=>u.includes(w)).length;
  return hit/words.length >= 0.5;
}

    saveState(); refreshTopbar(); toast('Đã đánh dấu '+vocab.length+' từ là đã học.'); showView('units',{unit:u});
  });
  box.querySelectorAll('[data-goreading]').forEach(b=>b.addEventListener('click',()=>showView('reading',{unit:Number(b.dataset.goreading)})));
  box.querySelector('[data-goopen]').addEventListener('click',()=>showView('open'));
  attachExerciseHandlers(box);
}

/* =========================================================================
   8. BÀI TẬP – RENDER CHUNG
   ========================================================================= */
function exerciseSetHTML(e){
  let inner='';
  if(e.type==='match'){
    const rights = shuffle(e.pairs.map(p=>p.right));
    inner = e.pairs.map((p,i)=>`
      <div class="matchrow">
        <div class="mleft">${i+1}. ${esc(p.left)}</div>
        <select data-match="${i}">
          <option value="">— chọn định nghĩa —</option>
          ${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}
        </select>
      </div>`).join('');
    inner += `<div class="row" style="margin-top:8px">
      <button class="btn primary small" data-checkmatch="${e.id}">Kiểm tra</button>
      <button class="btn small" data-resetmatch="${e.id}">Làm lại</button></div>`;
  }
  else if(e.type==='sort'){
    inner = `<div class="chips" id="sortpool-${e.id}">
      ${shuffle(e.items.map(i=>i.w)).map(w=>`<span class="chip" draggable="true" data-sortword="${esc(w)}" data-set="${e.id}">${esc(w)}</span>`).join('')}
    </div>
    <p class="note">Kéo thả (hoặc chạm để chọn rồi chạm vào ô) để xếp từ vào đúng nhóm.</p>
    <div class="grid two">
      ${e.cats.map(c=>`<div class="zone" data-zone="${esc(c)}" data-set="${e.id}"><h4>${esc(c)}</h4><div class="zonebody"></div></div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn primary small" data-checksort="${e.id}">Kiểm tra</button>
      <button class="btn small" data-resetsort="${e.id}">Làm lại</button></div>`;
  }
  else if(e.type==='complete'){
    inner = e.items.map((it,i)=>`
      <div class="qbox">
        <div class="qtext">${i+1}. ${esc(it.hint)}</div>
        <div class="note" style="font-family:monospace;margin-bottom:6px">${esc(it.pattern)}</div>
        <input type="text" data-complete="${i}" data-set="${e.id}" placeholder="Nhập từ hoàn chỉnh...">
      </div>`).join('');
    inner += `<div class="row"><button class="btn primary small" data-checkcomplete="${e.id}">Kiểm tra</button>
      <button class="btn small" data-resetcomplete="${e.id}">Làm lại</button></div>`;
  }
  else if(e.type==='fill'){
    inner = `<p class="note">Word bank: <b>${e.bank.map(esc).join(' · ')}</b></p>` +
      e.items.map((it,i)=>`
      <div class="qbox">
        <div class="qtext">${i+1}. ${esc(it.q)}</div>
        <input type="text" data-fill="${i}" data-set="${e.id}" placeholder="Nhập từ còn thiếu...">
      </div>`).join('');
    inner += `<div class="row"><button class="btn primary small" data-checkfill="${e.id}">Kiểm tra</button>
      <button class="btn small" data-resetfill="${e.id}">Làm lại</button></div>`;
  }
  else if(e.type==='mc'){
    inner = e.items.map((it,i)=>`
      <div class="qbox">
        <div class="qtext">${esc(it.q)}</div>
        ${it.o.map((o,j)=>`<button class="opt" data-mcset="${e.id}" data-mcq="${i}" data-mco="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}
        <div class="feedback" id="mcfb-${e.id}-${i}"></div>
      </div>`).join('');
  }
  return `<div class="exset" data-set="${e.id}" style="margin-bottom:18px">
    <h3>${esc(e.title)} <span class="tag grey">${esc(e.note||'')}</span></h3>
    ${inner}
    <div class="feedback" id="fb-${e.id}"></div>
  </div>`;
}

const EX_MAP = {}; EXERCISES.forEach(e=>EX_MAP[e.id]=e);

function attachExerciseHandlers(root){
  /* Matching */
  root.querySelectorAll('[data-checkmatch]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const set = EX_MAP[btn.dataset.checkmatch];
      const wrap = root.querySelector(`.exset[data-set="${set.id}"]`);
      let ok=0;
      set.pairs.forEach((p,i)=>{
        const sel = wrap.querySelector(`select[data-match="${i}"]`);
        const correct = sel.value === p.right;
        sel.style.borderColor = correct ? 'var(--ok)' : 'var(--err)';
        if(correct) ok++; else {
          addMistake({key:set.id+'-m'+i, unit:set.unit, type:'match',
            prompt:`Nối "${p.left}" với định nghĩa đúng`, user: sel.value||'(bỏ trống)', correct:p.right,
            explanation:`"${p.left}" = ${p.right}`});
        }
      });
      recordUnit(set.unit, ok===set.pairs.length);
      const fb = wrap.querySelector('#fb-'+set.id);
      fb.className='feedback show '+(ok===set.pairs.length?'ok':'err');
      fb.innerHTML = ok===set.pairs.length
        ? `✅ Tuyệt vời! Bạn nối đúng tất cả ${set.pairs.length} cặp.`
        : `Bạn đúng ${ok}/${set.pairs.length}. Ô đúng được viền xanh, ô sai viền đỏ. Hãy thử lại!`;
      if(ok===set.pairs.length){ state.exercisesDone[set.id]=true; logActivity('Hoàn thành '+set.title); }
      saveState();
    });
  });
  root.querySelectorAll('[data-resetmatch]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const wrap = root.querySelector(`.exset[data-set="${btn.dataset.resetmatch}"]`);
      wrap.querySelectorAll('select').forEach(s=>{ s.value=''; s.style.borderColor=''; });
      const fb=wrap.querySelector('#fb-'+btn.dataset.resetmatch); fb.className='feedback'; fb.innerHTML='';
    });
  });

  /* Sorting */
  root.querySelectorAll('.zone').forEach(zone=>{
    zone.addEventListener('click',()=>{
      const chip = root.querySelector('.chip.sel');
      if(chip && chip.dataset.set===zone.dataset.set){
        zone.querySelector('.zonebody').appendChild(chip);
        chip.classList.remove('sel');
      }
    });
    zone.addEventListener('dragover',e=>{e.preventDefault(); zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{
      e.preventDefault(); zone.classList.remove('over');
      const w = e.dataTransfer.getData('text/plain');
      const chip = root.querySelector(`.chip[data-sortword="${CSS.escape(w)}"][data-set="${zone.dataset.set}"]`);
      if(chip) zone.querySelector('.zonebody').appendChild(chip);
    });
  });
  root.querySelectorAll('.chip[data-sortword]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const same = root.querySelectorAll(`.chip[data-set="${chip.dataset.set}"].sel`);
      same.forEach(c=>{ if(c!==chip) c.classList.remove('sel'); });
      chip.classList.toggle('sel');
    });
    chip.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', chip.dataset.sortword); });
  });
  root.querySelectorAll('[data-checksort]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const set = EX_MAP[btn.dataset.checksort];
      let ok=0;
      set.items.forEach(it=>{
        const chip = root.querySelector(`.chip[data-sortword="${CSS.escape(it.w)}"][data-set="${set.id}"]`);
        if(!chip) return;
        const parentZone = chip.closest('.zone');
        const inPool = chip.closest('.chips');
        if(inPool){ chip.style.background='var(--err-bg)'; chip.style.borderColor='var(--err)'; return; }
        if(parentZone && parentZone.dataset.zone===it.c){ chip.style.background='var(--ok-bg)'; chip.style.borderColor='var(--ok)'; ok++; }
        else{
          chip.style.background='var(--err-bg)'; chip.style.borderColor='var(--err)';
          addMistake({key:set.id+'-s-'+it.w, unit:set.unit, type:'sort',
            prompt:`Xếp "${it.w}" vào đúng nhóm`, user: parentZone? parentZone.dataset.zone : '(chưa xếp)',
            correct: it.c, explanation:`"${it.w}" thuộc nhóm "${it.c}".`});
        }
      });
      recordUnit(set.unit, ok===set.items.length);
      const fb = root.querySelector('#fb-'+set.id);
      fb.className='feedback show '+(ok===set.items.length?'ok':'err');
      fb.innerHTML = ok===set.items.length ? '✅ Chính xác! Bạn đã xếp đúng tất cả.' : `Bạn xếp đúng ${ok}/${set.items.length}. Từ đúng được tô xanh, từ sai tô đỏ.`;
      if(ok===set.items.length){ state.exercisesDone[set.id]=true; logActivity('Hoàn thành '+set.title); }
      saveState();
    });
  });
  root.querySelectorAll('[data-resetsort]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const set = EX_MAP[btn.dataset.resetsort];
      const pool = root.querySelector('#sortpool-'+set.id);
      root.querySelectorAll(`.chip[data-set="${set.id}"]`).forEach(c=>{
        c.style.background=''; c.style.borderColor=''; c.classList.remove('sel');
        pool.appendChild(c);
      });
      const fb=root.querySelector('#fb-'+set.id); fb.className='feedback'; fb.innerHTML='';
    });
  });

  /* Complete the word */
  root.querySelectorAll('[data-checkcomplete]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const set=EX_MAP[btn.dataset.checkcomplete];
      const wrap=root.querySelector(`.exset[data-set="${set.id}"]`);
      let ok=0;
      set.items.forEach((it,i)=>{
        const inp = wrap.querySelector(`input[data-complete="${i}"]`);
        const good = norm(inp.value)===norm(it.answer);
        inp.style.borderColor = good?'var(--ok)':'var(--err)';
        if(good) ok++;
        else if(inp.value.trim()){
          addMistake({key:set.id+'-c'+i, unit:set.unit, type:'complete',
            prompt:`${it.hint} (${it.pattern})`, user:inp.value, correct:it.answer,
            explanation:`Đáp án đúng là "${it.answer}".`});
        }
      });
      recordUnit(set.unit, ok===set.items.length);
      const fb=wrap.querySelector('#fb-'+set.id);
      fb.className='feedback show '+(ok===set.items.length?'ok':'err');
      fb.innerHTML = ok===set.items.length ? '✅ Chính xác toàn bộ!' : `Bạn đúng ${ok}/${set.items.length}. Đáp án: ${set.items.map(x=>x.answer).join(' · ')}`;
      if(ok===set.items.length){ state.exercisesDone[set.id]=true; logActivity('Hoàn thành '+set.title); }
      saveState();
    });
  });
  root.querySelectorAll('[data-resetcomplete]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const wrap=root.querySelector(`.exset[data-set="${btn.dataset.resetcomplete}"]`);
      wrap.querySelectorAll('input').forEach(i=>{ i.value=''; i.style.borderColor=''; });
      const fb=wrap.querySelector('#fb-'+btn.dataset.resetcomplete); fb.className='feedback'; fb.innerHTML='';
    });
  });

  /* Fill in the blanks */
  root.querySelectorAll('[data-checkfill]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const set=EX_MAP[btn.dataset.checkfill];
      const wrap=root.querySelector(`.exset[data-set="${set.id}"]`);
      let ok=0;
      set.items.forEach((it,i)=>{
        const inp = wrap.querySelector(`input[data-fill="${i}"]`);
        const good = norm(inp.value)===norm(it.a);
        inp.style.borderColor = good?'var(--ok)':'var(--err)';
        if(good) ok++;
        else if(inp.value.trim()){
          addMistake({key:set.id+'-f'+i, unit:set.unit, type:'fill',
            prompt:it.q, user:inp.value, correct:it.a, explanation: it.ex || `Đáp án: ${it.a}`});
        }
      });
      recordUnit(set.unit, ok===set.items.length);
      const fb=wrap.querySelector('#fb-'+set.id);
      fb.className='feedback show '+(ok===set.items.length?'ok':'err');
      fb.innerHTML = ok===set.items.length ? '✅ Chính xác toàn bộ!' : `Bạn đúng ${ok}/${set.items.length}. Đáp án: ${set.items.map(x=>x.a).join(' · ')}`;
      if(ok===set.items.length){ state.exercisesDone[set.id]=true; logActivity('Hoàn thành '+set.title); }
      saveState();
    });
  });
  root.querySelectorAll('[data-resetfill]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const wrap=root.querySelector(`.exset[data-set="${btn.dataset.resetfill}"]`);
      wrap.querySelectorAll('input').forEach(i=>{ i.value=''; i.style.borderColor=''; });
      const fb=wrap.querySelector('#fb-'+btn.dataset.resetfill); fb.className='feedback'; fb.innerHTML='';
    });
  });

  /* Multiple choice inside exercise sets */
  root.querySelectorAll('[data-mcset]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const set=EX_MAP[btn.dataset.mcset];
      const qi=Number(btn.dataset.mcq), oi=Number(btn.dataset.mco);
      const item=set.items[qi];
      const wrap=root.querySelector(`.exset[data-set="${set.id}"]`);
      wrap.querySelectorAll(`[data-mcset="${set.id}"][data-mcq="${qi}"]`).forEach(b=>b.classList.remove('sel','correct','wrong'));
      const good = oi===item.a;
      btn.classList.add(good?'correct':'wrong');
      if(!good) wrap.querySelectorAll(`[data-mcset="${set.id}"][data-mcq="${qi}"]`)[item.a].classList.add('correct');
      const fb = wrap.querySelector(`#mcfb-${set.id}-${qi}`);
      fb.className='feedback show '+(good?'ok':'err');
      fb.innerHTML = good
        ? `✅ Chính xác! ${esc(item.ex||'')}`
        : `❌ Chưa đúng. Đáp án đúng: <b>${String.fromCharCode(65+item.a)}. ${esc(item.o[item.a])}</b><br>${esc(item.ex||'')}`;
      recordUnit(set.unit, good);
      if(!good){
        addMistake({key:set.id+'-mc'+qi, unit:set.unit, type:'mc',
          prompt:item.q, user:item.o[oi], correct:item.o[item.a], explanation:item.ex||''});
      }
      saveState();
    });
  });
}

function renderReading(main, opts){
  opts=opts||{};
  let u = Number(opts.unit) || Number(state.lastUnit) || 1;
  if(!READINGS[u]) u=1;
  const tabs = UNITS.map(x=>`<button class="tab ${x.id===u?'active':''}" data-unit="${x.id}">Unit ${x.id}</button>`).join('');
  main.innerHTML = `
    <h1>📝 Luyện đọc hiểu</h1>
    <div class="tabs">${tabs}</div>
    <div id="readBody"></div>`;
  main.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showView('reading',{unit:Number(t.dataset.unit)})));

  const box = main.querySelector('#readBody');
  const r = READINGS[u];
  const qs = READING_QS[u] || [];
  let answered = 0;

  box.innerHTML = `
  <div class="card">
    <span class="tag">Unit ${u}</span>
    <h2 style="margin-top:8px">${esc(r.title)}</h2>
    ${r.by?`<p class="note" style="margin-top:-6px">${esc(r.by)}</p>`:''}
    <div class="passage">${r.html}</div>
  </div>
  <div class="card">
    <h2>Câu hỏi đọc hiểu <span class="tag orange">Luyện tập thêm</span></h2>
    <p class="note">Các câu hỏi dưới đây do ứng dụng tạo thêm, dựa trực tiếp trên nội dung bài đọc gốc.</p>
    <div class="progressbar" style="margin-bottom:12px"><div id="readProg" style="width:0%"></div></div>
    <div id="readQs"></div>
  </div>`;

  const qWrap = box.querySelector('#readQs');
  qWrap.innerHTML = qs.map((q,i)=>{
    if(q.t==='mc'){
      return `<div class="qbox" data-q="${i}">
        <div class="qtext">${i+1}. ${esc(q.q)}</div>
        ${q.o.map((o,j)=>`<button class="opt" data-rq="${i}" data-ro="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}
        <div class="feedback" id="rfb-${i}"></div>
      </div>`;
    }
    return `<div class="qbox" data-q="${i}">
      <div class="qtext">${i+1}. ${esc(q.q)} <span class="tag grey">True / False</span></div>
      <button class="opt" data-rq="${i}" data-ro="true">True (Đúng)</button>
      <button class="opt" data-rq="${i}" data-ro="false">False (Sai)</button>
      <div class="feedback" id="rfb-${i}"></div>
    </div>`;
  }).join('');

  qWrap.querySelectorAll('[data-rq]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.rq), q=qs[i];
      const isTF = q.t==='tf';
      const chosen = isTF ? (btn.dataset.ro==='true') : Number(btn.dataset.ro);
      // ✅ FIX #3: Bỏ ternary trùng lặp (trước đây cả hai nhánh đều giống nhau)
      const good = chosen===q.a;
      const qbox = qWrap.querySelector(`.qbox[data-q="${i}"]`);
      const already = qbox.dataset.done==='1';
      qbox.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','correct','wrong'));
      const correctBtn = isTF
        ? qbox.querySelector(`.opt[data-ro="${q.a?'true':'false'}"]`)
        : qbox.querySelectorAll('.opt')[q.a];
      if(good){
        btn.classList.add('correct');
        if(correctBtn) correctBtn.classList.add('correct');
      }else{
        btn.classList.add('wrong');
        if(correctBtn) correctBtn.classList.add('correct');
      }
      const fb=qWrap.querySelector('#rfb-'+i);
      fb.className='feedback show '+(good?'ok':'err');
      fb.innerHTML = (good?'✅ Chính xác! ':'❌ Chưa đúng. ') + esc(q.ex);
      if(!already){ qbox.dataset.done='1'; answered++; box.querySelector('#readProg').style.width = Math.round(answered/qs.length*100)+'%'; }
      recordUnit(u, good);
      if(!good){
        addMistake({key:'read-'+u+'-'+i, unit:u, type:'reading',
          prompt:q.q, user: isTF?(chosen?'True':'False'):q.o[chosen],
          correct: isTF?(q.a?'True':'False'):q.o[q.a], explanation:q.ex});
      }
      saveState();
    });
  });
}

function renderExercises(main, opts){

  let u = Number(opts.unit) || Number(state.lastUnit) || 1;
  if(!UNITS.find(x=>x.id===u)) u=1;
  const tabs = UNITS.map(x=>`<button class="tab ${x.id===u?'active':''}" data-unit="${x.id}">Unit ${x.id}</button>`).join('');

  main.innerHTML = `

  <div class="tabs">${tabs}</div>
  <div class="card">
    <h2>🎮 Bài tập tạo thêm (nhiều dạng)</h2>
    <p class="note">Các dạng: Matching (nối), Multiple choice (trắc nghiệm), Fill in the blanks (điền khuyết),

      <button class="btn small primary" data-gen="sort">📂 Word sorting</button>

      <button class="btn small primary" data-gen="en2vi">🇬🇧→🇻🇳 Anh→Việt</button>
      <button class="btn small primary" data-gen="sentence">📝 Sentence construction</button>
    </div>
  </div>
  <div id="genBox"></div>

  main.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{

  }));

  const origBox = main.querySelector('#origBox');
  const exs = EXERCISES.filter(e=>e.unit===u);
  origBox.innerHTML = exs.length ? exs.map(e=>exerciseSetHTML(e)).join('')
    : '<div class="note">Không có bài tập gốc cho bài này.</div>';
  attachExerciseHandlers(origBox);

  const genBox = main.querySelector('#genBox');
  main.querySelectorAll('[data-gen]').forEach(b=>{
    b.addEventListener('click',()=>{ generateExercise(genBox, b.dataset.gen, u); });
  });
  generateExercise(genBox,'mc',u);
}

function generateExercise(box, type, unit){
  const pool = vocabByUnit(unit);
  if(!pool.length){ box.innerHTML='<div class="card note">Không có dữ liệu.</div>'; return; }

  if(type==='match'){
    const items = pick(pool, Math.min(5,pool.length));
    const rights = shuffle(items.map(i=>i.vi));
    box.innerHTML = `<div class="card">
      <h2>🔗 Matching – Nối từ với nghĩa (Unit ${unit})</h2>
      ${items.map((it,i)=>`<div class="matchrow">
        <div class="mleft">${i+1}. ${esc(it.en)} <span class="ipa">${esc(it.ipa)}</span></div>
        <select data-gm="${i}">
          <option value="">— chọn nghĩa —</option>
          ${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}
        </select></div>`).join('')}
      <div class="row"><button class="btn primary small" id="gmc">Kiểm tra</button>
      <button class="btn small" id="gmr">Làm lại</button></div>
      <div class="feedback" id="gmfb"></div>
    </div>`;
    box.querySelector('#gmr').addEventListener('click',()=>generateExercise(box,'match',unit));
    box.querySelector('#gmc').addEventListener('click',()=>{
      let ok=0;
      items.forEach((it,i)=>{
        const sel = box.querySelector(`select[data-gm="${i}"]`);
        const good = sel.value===it.vi;
        sel.style.borderColor = good?'var(--ok)':'var(--err)';
        if(good) ok++; else addMistake({key:'gen-match-'+unit+'-'+it.id, unit, type:'match',
          prompt:`Nối "${it.en}" với nghĩa đúng`, user:sel.value||'(bỏ trống)', correct:it.vi,
          explanation:`${it.en} ${it.ipa} = ${it.vi}`});
      });
      recordUnit(unit, ok===items.length);
      const fb=box.querySelector('#gmfb');
      fb.className='feedback show '+(ok===items.length?'ok':'err');
      fb.innerHTML = ok===items.length ? '✅ Chính xác tất cả!' : `Bạn đúng ${ok}/${items.length}. Hãy thử lại.`;
      saveState();
    });
    return;
  }

  if(type==='sort'){
    const cats = ['Danh từ / Cụm danh từ','Tính từ','Động từ / Cụm động từ'];
    // ✅ FIX #2: Đưa "adjective phrase" về đúng nhóm Tính từ (trước đây bị nhảy sang nhóm Động từ)
    const classify = v => {
      const p = v.pos.toLowerCase();
      if(p.includes('adjective')) return 'Tính từ';
      if(p.includes('verb')) return 'Động từ / Cụm động từ';
      if(p.includes('noun')) return 'Danh từ / Cụm danh từ';
      if(p.includes('phrase') || p.includes('collocation')) return 'Động từ / Cụm động từ';
      return 'Danh từ / Cụm danh từ';
    };
    const items = pick(pool, Math.min(8,pool.length)).map(v=>({w:v.en,c:classify(v)}));
    box.innerHTML = `<div class="card">
      <h2>📂 Word sorting – Phân loại từ loại (Unit ${unit})</h2>
      <div class="chips" id="gspool">${shuffle(items.map(i=>i.w)).map(w=>`<span class="chip" draggable="true" data-gw="${esc(w)}">${esc(w)}</span>`).join('')}</div>
      <p class="note">Chạm để chọn từ, sau đó chạm vào ô nhóm. Hoặc kéo thả.</p>
      <div class="grid three">${cats.map(c=>`<div class="zone" data-gzone="${esc(c)}"><h4>${esc(c)}</h4><div class="zonebody"></div></div>`).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn primary small" id="gsc">Kiểm tra</button>
      <button class="btn small" id="gsr">Làm lại</button></div>
      <div class="feedback" id="gsfb"></div>
    </div>`;
    const root=box;
    root.querySelectorAll('.zone').forEach(z=>{
      z.addEventListener('click',()=>{
        const chip=root.querySelector('.chip.sel');
        if(chip){ z.querySelector('.zonebody').appendChild(chip); chip.classList.remove('sel'); }
      });
      z.addEventListener('dragover',e=>{e.preventDefault(); z.classList.add('over');});
      z.addEventListener('dragleave',()=>z.classList.remove('over'));
      z.addEventListener('drop',e=>{
        e.preventDefault(); z.classList.remove('over');
        const w=e.dataTransfer.getData('text/plain');
        const chip=root.querySelector(`.chip[data-gw="${CSS.escape(w)}"]`);
        if(chip) z.querySelector('.zonebody').appendChild(chip);
      });
    });
    root.querySelectorAll('.chip[data-gw]').forEach(c=>{
      c.addEventListener('click',()=>{
        root.querySelectorAll('.chip.sel').forEach(x=>{ if(x!==c) x.classList.remove('sel'); });
        c.classList.toggle('sel');
      });
      c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain', c.dataset.gw));
    });
    root.querySelector('#gsr').addEventListener('click',()=>generateExercise(box,'sort',unit));
    root.querySelector('#gsc').addEventListener('click',()=>{
      let ok=0;
      items.forEach(it=>{
        const chip=root.querySelector(`.chip[data-gw="${CSS.escape(it.w)}"]`);
        if(!chip) return;
        const z=chip.closest('.zone');
        if(z && z.dataset.gzone===it.c){ chip.style.background='var(--ok-bg)'; chip.style.borderColor='var(--ok)'; ok++; }
        else{ chip.style.background='var(--err-bg)'; chip.style.borderColor='var(--err)';
          addMistake({key:'gen-sort-'+unit+'-'+it.w, unit, type:'sort',
            prompt:`Xếp "${it.w}" vào đúng nhóm từ loại`, user: z? z.dataset.gzone:'(chưa xếp)', correct:it.c,
            explanation:`"${it.w}" thuộc nhóm "${it.c}".`});
        }
      });
      recordUnit(unit, ok===items.length);
      const fb=root.querySelector('#gsfb');
      fb.className='feedback show '+(ok===items.length?'ok':'err');
      fb.innerHTML = ok===items.length?'✅ Chính xác!':`Bạn đúng ${ok}/${items.length}.`;
      saveState();
    });
    return;
  }

  if(type==='sentence'){
    const items = pick(pool,5);
    box.innerHTML = `<div class="card">
      <h2>📝 Sentence construction – Đặt câu với từ vựng (Unit ${unit})</h2>
      <p class="note">Hãy viết một câu tiếng Anh hoàn chỉnh có sử dụng từ cho sẵn. Câu cần có ít nhất 5 từ.
      Ứng dụng kiểm tra sự xuất hiện của từ khoá và độ dài câu (đây là đánh giá gần đúng, không phải chấm điểm AI).</p>
      ${items.map((v,i)=>`<div class="qbox">
        <div class="qtext">${i+1}. Viết câu với: <b>${esc(v.en)}</b> ${esc(v.ipa)} – ${esc(v.vi)}</div>
        <textarea data-gs="${i}" placeholder="Nhập câu của bạn..."></textarea>
        <div class="row" style="margin-top:6px">
          <button class="btn small primary" data-gscheck="${i}">Kiểm tra</button>
          <button class="btn small" data-gsmodel="${i}">Xem câu mẫu</button>
        </div>
        <div class="feedback" id="gsfb-${i}"></div>
      </div>`).join('')}
    </div>`;
    items.forEach((v,i)=>{
      box.querySelector(`[data-gscheck="${i}"]`).addEventListener('click',()=>{
        const txt = box.querySelector(`textarea[data-gs="${i}"]`).value.trim();
        const fb = box.querySelector(`#gsfb-${i}`);
        const word = v.en.split(' / ')[0].split(' ')[0];
        const hasWord = norm(txt).includes(norm(word));
        const wc = txt.split(/\s+/).filter(Boolean).length;
        const good = hasWord && wc>=5;
        fb.className='feedback show '+(good?'ok':'err');
        if(good){
          fb.innerHTML = `✅ Câu của bạn có sử dụng "${esc(word)}" và đủ độ dài. Tốt lắm! (Câu mẫu: <i>${esc(v.ex)}</i>)`;
          state.exercisesDone['gen-sentence-'+unit+'-'+v.id]=true;
        }else{
          fb.innerHTML = `❌ ${!hasWord?'Câu chưa chứa từ khoá <b>'+esc(word)+'</b>. ':''}${wc<5?'Câu cần ít nhất 5 từ. ':''}
          Câu mẫu: <i>${esc(v.ex)}</i>`;
          addMistake({key:'gen-sentence-'+v.id, unit, type:'sentence',
            prompt:`Đặt câu với "${v.en}"`, user:txt||'(bỏ trống)', correct:v.ex,
            explanation:`Câu mẫu: ${v.ex} – ${v.exVi}`});
        }
        recordUnit(unit, good); saveState();
      });
      box.querySelector(`[data-gsmodel="${i}"]`).addEventListener('click',()=>{
        const fb=box.querySelector(`#gsfb-${i}`);
        fb.className='feedback show info';
        fb.innerHTML = `Câu mẫu: <b>${esc(v.ex)}</b><br><i>${esc(v.exVi)}</i>`;
      });
    });
    return;
  }

  if(type==='complete'){
    const items = pick(pool.filter(v=>/^[a-zA-Z-]{4,}$/.test(v.en.split(' / ')[0])), Math.min(6,pool.length));
    if(!items.length){ box.innerHTML='<div class="card note">Không đủ dữ liệu.</div>'; return; }
    box.innerHTML = `<div class="card">
      <h2>🧩 Word completion – Hoàn thành từ (Unit ${unit})</h2>
      ${items.map((v,i)=>{
        const w=v.en.split(' / ')[0];
        const pat = w[0]+' '+Array(Math.max(w.length-1,1)).fill('-').join(' ');
        return `<div class="qbox">
          <div class="qtext">${i+1}. ${esc(v.vi)} <span class="note">(${w.length} chữ cái)</span></div>
          <div class="note" style="font-family:monospace;margin-bottom:6px">${esc(pat)}</div>
          <input type="text" data-gc="${i}" placeholder="Nhập từ...">
          <div class="feedback" id="gcfb-${i}"></div>
        </div>`;
      }).join('')}
      <button class="btn primary small" id="gcc">Kiểm tra tất cả</button>
    </div>`;
    box.querySelector('#gcc').addEventListener('click',()=>{
      let ok=0;
      items.forEach((v,i)=>{
        const w=v.en.split(' / ')[0];
        const inp=box.querySelector(`input[data-gc="${i}"]`);
        const good=norm(inp.value)===norm(w);
        inp.style.borderColor = good?'var(--ok)':'var(--err)';
        const fb=box.querySelector(`#gcfb-${i}`);
        fb.className='feedback show '+(good?'ok':'err');
        fb.innerHTML = good?'✅ Đúng!':`❌ Đáp án: <b>${esc(w)}</b> ${esc(v.ipa)} – ${esc(v.vi)}`;
        if(good) ok++; else addMistake({key:'gen-complete-'+v.id, unit, type:'complete',
          prompt:`Hoàn thành từ có nghĩa "${v.vi}"`, user:inp.value, correct:w, explanation:`Đáp án: ${w} ${v.ipa}`});
      });
      recordUnit(unit, ok===items.length);
      toast(`Đúng ${ok}/${items.length}`);
      saveState();
    });
    return;
  }

  if(type==='fill'){
    const items = [];
    pick(pool, Math.min(20,pool.length)).forEach(v=>{
      const w=v.en.split(' / ')[0];
      if(/[()\/]/.test(w)) return;
      const re = new RegExp('\\b'+escRe(w)+'\\b','i');
      if(re.test(v.ex)) items.push({v, blank:v.ex.replace(re,'______')});
    });
    const finalItems = items.slice(0,6);
    if(!finalItems.length){ box.innerHTML='<div class="card note">Không đủ dữ liệu cho dạng bài này.</div>'; return; }
    box.innerHTML = `<div class="card">
      <h2>✍️ Fill in the blanks – Điền từ còn thiếu (Unit ${unit})</h2>
      ${finalItems.map((it,i)=>`<div class="qbox">
        <div class="qtext">${i+1}. ${esc(it.blank)}</div>
        <input type="text" data-gf="${i}" placeholder="Nhập từ...">
        <div class="feedback" id="gffb-${i}"></div>
      </div>`).join('')}
      <button class="btn primary small" id="gfc">Kiểm tra tất cả</button>
    </div>`;
    box.querySelector('#gfc').addEventListener('click',()=>{
      let ok=0;
      finalItems.forEach((it,i)=>{
        const w=it.v.en.split(' / ')[0];
        const inp=box.querySelector(`input[data-gf="${i}"]`);
        const good=norm(inp.value)===norm(w);
        inp.style.borderColor=good?'var(--ok)':'var(--err)';
        const fb=box.querySelector(`#gffb-${i}`);
        fb.className='feedback show '+(good?'ok':'err');
        fb.innerHTML = good?'✅ Đúng!':`❌ Đáp án: <b>${esc(w)}</b> – ${esc(it.v.vi)}`;
        if(good) ok++; else addMistake({key:'gen-fill-'+it.v.id, unit, type:'fill',
          prompt:it.blank, user:inp.value, correct:w, explanation:`${w} ${it.v.ipa} = ${it.v.vi}`});
      });
      recordUnit(unit, ok===finalItems.length);
      toast(`Đúng ${ok}/${finalItems.length}`);
      saveState();
    });
    return;
  }

  if(type==='vn2en' || type==='en2vi'){
    const items = pick(pool, Math.min(6,pool.length));
    const isVn2En = type==='vn2en';
    box.innerHTML = `<div class="card">
      <h2>${isVn2En?'🇻🇳→🇬🇧 Việt → Anh':'🇬🇧→🇻🇳 Anh → Việt'} (Unit ${unit})</h2>
      ${items.map((v,i)=>`<div class="qbox">
        <div class="qtext">${i+1}. ${isVn2En? esc(v.vi)+` <span class="note">(${esc(v.pos)})</span>` : esc(v.en)+` <span class="ipa">${esc(v.ipa)}</span>`}</div>
        <input type="text" data-gr="${i}" placeholder="${isVn2En?'Nhập từ/cụm tiếng Anh...':'Nhập nghĩa tiếng Việt...'}">
        <div class="feedback" id="grfb-${i}"></div>
      </div>`).join('')}
      <button class="btn primary small" id="grc">Kiểm tra tất cả</button>
    </div>`;
    box.querySelector('#grc').addEventListener('click',()=>{
      let ok=0;
      items.forEach((v,i)=>{
        const inp=box.querySelector(`input[data-gr="${i}"]`);
        // ✅ FIX #1c: dùng enMatch cho VN→EN, viMatch cho EN→VI
        const good = isVn2En ? enMatch(inp.value, v.en) : viMatch(inp.value, v.vi);
        inp.style.borderColor=good?'var(--ok)':'var(--err)';
        const fb=box.querySelector(`#grfb-${i}`);
        fb.className='feedback show '+(good?'ok':'err');
        fb.innerHTML = good?'✅ Chính xác!':`❌ Đáp án: <b>${isVn2En?esc(v.en):esc(v.vi)}</b>${isVn2En?' '+esc(v.ipa):''}`;
        if(good) ok++; else addMistake({key:'gen-recall-'+type+'-'+v.id, unit, type:'recall',
          prompt: isVn2En? `Từ tiếng Anh của "${v.vi}"` : `Nghĩa tiếng Việt của "${v.en}"`,
          user: inp.value, correct: isVn2En? v.en : v.vi,
          explanation:`${v.en} ${v.ipa} = ${v.vi}. Ví dụ: ${v.ex}`});
      });
      recordUnit(unit, ok===items.length);
      toast(`Đúng ${ok}/${items.length}`);
      saveState();
    });
    return;
  }

  /* Multiple choice mặc định */
  const items = pick(pool, Math.min(8,pool.length));
  const qs = items.map(v=>{
    const distract = pick(pool.filter(x=>x.id!==v.id), 3).map(x=>x.vi);
    const options = shuffle([v.vi].concat(distract));
    return {v, options, correct: options.indexOf(v.vi)};
  });
  box.innerHTML = `<div class="card">
    <h2>🔘 Multiple choice – Chọn nghĩa đúng (Unit ${unit})</h2>
    ${qs.map((q,i)=>`<div class="qbox">
      <div class="qtext">${i+1}. <b>${esc(q.v.en)}</b> <span class="ipa">${esc(q.v.ipa)}</span> (${esc(q.v.pos)})</div>
      ${q.options.map((o,j)=>`<button class="opt" data-gmc="${i}" data-gmo="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}
      <div class="feedback" id="gmcfb-${i}"></div>
    </div>`).join('')}
  </div>`;
  box.querySelectorAll('[data-gmc]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.gmc), j=Number(btn.dataset.gmo);
      const q=qs[i];
      const qbox = btn.closest('.qbox');
      qbox.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','correct','wrong'));
      const good = j===q.correct;
      btn.classList.add(good?'correct':'wrong');
      if(!good) qbox.querySelectorAll('.opt')[q.correct].classList.add('correct');
      const fb=qbox.querySelector('#gmcfb-'+i);
      fb.className='feedback show '+(good?'ok':'err');
      fb.innerHTML = good
        ? `✅ Chính xác! ${esc(q.v.en)} = ${esc(q.v.vi)}. Ví dụ: ${esc(q.v.ex)}`
        : `❌ Chưa đúng. Đáp án: <b>${esc(q.v.vi)}</b><br>${esc(q.v.en)} ${esc(q.v.ipa)}. Ví dụ: ${esc(q.v.ex)}`;
      recordUnit(unit, good);
      if(!good) addMistake({key:'gen-mc-'+q.v.id, unit, type:'mc',
        prompt:`Nghĩa của "${q.v.en}"`, user:q.options[j], correct:q.v.vi,
        explanation:`${q.v.en} ${q.v.ipa} = ${q.v.vi}. Ví dụ: ${q.v.ex}`});
      saveState();
    });
  });
}

function renderOpen(main){
  main.innerHTML = `
  <h1>💬 Câu hỏi tự luận – Open-ended Questions</h1>
  <div class="card">
    <p>Hãy trả lời bằng tiếng Anh. Bạn có thể <b>kiểm tra</b> (đánh giá gần đúng dựa trên từ khoá),
    <b>xem đáp án gợi ý</b>, <b>xem từ vựng hữu ích</b>, <b>sửa lại</b> và <b>lưu</b> câu trả lời.</p>
    <p class="note">⚠️ Lưu ý: hệ thống chấm điểm dựa trên từ khoá và chạy hoàn toàn trong trình duyệt,
    <b>không phải AI</b>. Nếu bạn diễn đạt khác đi mà vẫn đúng ý, câu trả lời vẫn có thể được chấp nhận —
    hãy đối chiếu với đáp án gợi ý.</p>
    <div class="row"><button class="btn small" id="openToggleAll">👁️ Ẩn / hiện tất cả đáp án gợi ý</button></div>
  </div>
  <div id="openList"></div>`;

  const list = main.querySelector('#openList');
  list.innerHTML = OPEN_QUESTIONS.map((q,i)=>`
    <div class="card" data-oq="${i}">
      <div class="qtext" style="font-size:1rem">Câu ${i+1}. ${esc(q.q)}</div>
      ${q.note?`<p class="note">📌 ${esc(q.note)}</p>`:''}
      <textarea data-oa="${i}" placeholder="Nhập câu trả lời tiếng Anh của bạn...">${esc(state.openAnswers[i]||'')}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn small primary" data-ocheck="${i}">✔️ Check My Answer</button>
        <button class="btn small" data-oshow="${i}">👀 Show Suggested Answer</button>
        <button class="btn small" data-ohide="${i}">🙈 Hide Suggested Answer</button>
        <button class="btn small" data-ovocab="${i}">📚 Show Useful Vocabulary</button>
        <button class="btn small ghost" data-otry="${i}">🔄 Try Again</button>
        <button class="btn small" data-osave="${i}">💾 Save Answer</button>
      </div>
      <div class="answerbox hidden" id="osug-${i}"><b>Suggested answer:</b><br>${esc(q.suggested)}</div>
      <div class="answerbox hidden" id="ovoc-${i}"><b>Useful vocabulary:</b><br>${q.vocab.map(v=>`<span class="tag" style="margin:2px">${esc(v)}</span>`).join('')}</div>
      <div class="feedback" id="ofb-${i}"></div>
    </div>`).join('');

  list.querySelectorAll('[data-oshow]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.oshow; const el=list.querySelector('#osug-'+i); el.classList.remove('hidden');
  }));
  list.querySelectorAll('[data-ohide]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.ohide; list.querySelector('#osug-'+i).classList.add('hidden');
  }));
  list.querySelectorAll('[data-ovocab]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.ovocab; const el=list.querySelector('#ovoc-'+i); el.classList.toggle('hidden');
  }));
  list.querySelectorAll('[data-otry]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.otry;
    const ta=list.querySelector(`textarea[data-oa="${i}"]`);
    ta.value=''; ta.focus();
    const fb=list.querySelector('#ofb-'+i); fb.className='feedback'; fb.innerHTML='';
    list.querySelector('#osug-'+i).classList.add('hidden');
  }));
  list.querySelectorAll('[data-osave]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.osave;
    state.openAnswers[i]=list.querySelector(`textarea[data-oa="${i}"]`).value;
    state.openDone[i]=true;
    logActivity('Đã lưu câu trả lời tự luận số '+(Number(i)+1));
    saveState();
    toast('💾 Đã lưu câu trả lời '+ (Number(i)+1));
  }));
  list.querySelectorAll('[data-ocheck]').forEach(b=>b.addEventListener('click',()=>{
    const i=Number(b.dataset.ocheck);
    const txt=list.querySelector(`textarea[data-oa="${i}"]`).value;
    const fb=list.querySelector('#ofb-'+i);
    if(!txt.trim()){
      fb.className='feedback show err';
      fb.innerHTML='❌ Bạn chưa nhập câu trả lời. Hãy viết câu trả lời rồi bấm kiểm tra.';
      return;
    }
    const res = checkOpenAnswer(i, txt);
    let color = res.score>=70 ? 'ok' : (res.score>=40 ? 'info' : 'err');
    fb.className='feedback show '+color;
    fb.innerHTML = `<b>Độ bao phủ ý: ${res.score}%</b><br>
      ${res.matched.length?`✅ Đã có ý: ${res.matched.map(m=>esc(m)).join(', ')}.<br>`:''}
      ${res.missing.length?`📌 Còn thiếu: ${res.missing.map(m=>esc(m)).join(', ')}.<br>`:''}
      <span class="note">Đây là đánh giá gần đúng dựa trên từ khoá, không phải chấm điểm bằng AI.
      Bạn có thể diễn đạt theo cách khác miễn là đủ ý. Hãy sửa lại và bấm kiểm tra lần nữa.</span>`;
    if(res.score>=50){
      state.openDone[i]=true;
      state.openAnswers[i]=txt;
      logActivity('Hoàn thành câu tự luận '+(i+1)+' ('+res.score+'%)');
      saveState();
    }
    recordUnit(0, res.score>=50);
  }));

  main.querySelector('#openToggleAll').addEventListener('click',()=>{
    const boxes = list.querySelectorAll('.answerbox[id^="osug-"]');
    const anyHidden = Array.from(boxes).some(b=>b.classList.contains('hidden'));
    boxes.forEach(b=>b.classList.toggle('hidden', !anyHidden));
  });
}

function checkOpenAnswer(idx, text){
  const q = OPEN_QUESTIONS[idx];
  const t = ' ' + norm(text) + ' ';
  const matched=[], missing=[];
  q.keys.forEach(g=>{
    const hit = g.alts.some(a=> t.includes(norm(a)));
    if(hit) matched.push(g.label); else missing.push(g.label);
  });
  const score = q.keys.length ? Math.round(matched.length/q.keys.length*100) : 0;
  return {score, matched, missing};
}

let lastTestResult=null;

function buildQuestionPool(){
  const pool=[];
  VOCAB.forEach(v=>{
    const others = pick(VOCAB.filter(x=>x.id!==v.id && norm(x.vi)!==norm(v.vi)),3).map(x=>x.vi);
    if(others.length===3){
      pool.push({key:'t-mc-en-vi-'+v.id, unit:v.units[0], type:'mc',
        prompt:`Từ/cụm từ tiếng Anh "<b>${v.en}</b>" (${v.pos}) có nghĩa là gì?`,
        options: shuffle([v.vi].concat(others)), answer:v.vi,
        explanation:`<b>${v.en}</b> ${v.ipa} = ${v.vi}. Ví dụ: ${v.ex}`});
    }
    const others2 = pick(VOCAB.filter(x=>x.id!==v.id && norm(x.en)!==norm(v.en)),3).map(x=>x.en);
    if(others2.length===3){
      pool.push({key:'t-mc-vi-en-'+v.id, unit:v.units[0], type:'mc',
        prompt:`Từ/cụm từ tiếng Anh nào có nghĩa là "<b>${v.vi}</b>"?`,
        options: shuffle([v.en].concat(others2)), answer:v.en,
        explanation:`"${v.vi}" = <b>${v.en}</b> ${v.ipa}`});
    }
    pool.push({key:'t-vn2en-'+v.id, unit:v.units[0], type:'text',
      prompt:`Viết từ/cụm từ tiếng Anh có nghĩa: "<b>${v.vi}</b>" (${v.pos})`,
      answer:v.en, accept:[v.en], explanation:`Đáp án: <b>${v.en}</b> ${v.ipa} – ${v.vi}`});

    const w = v.en.split(' / ')[0];
    if(!/[()\/]/.test(w) && w.split(' ').length<=2){
      const re = new RegExp('\\b'+escRe(w)+'\\b','i');
      if(re.test(v.ex)){
        pool.push({key:'t-fill-'+v.id, unit:v.units[0], type:'text',
          prompt:`Điền từ còn thiếu vào câu: "${esc(v.ex.replace(re,'______'))}"`,
          answer:w, accept:[w], explanation:`Đáp án: <b>${w}</b> (${v.vi})`});
      }
    }
    const single = v.en.split(' / ')[0];
    if(/^[a-zA-Z-]+$/.test(single) && single.length>=4){
      const pat = single[0]+' '+Array(single.length-1).fill('-').join(' ');
      pool.push({key:'t-wc-'+v.id, unit:v.units[0], type:'text',
        // ✅ FIX #4: bọc esc() cho pat để tránh ký tự đặc biệt phá HTML
        prompt:`Hoàn thành từ (${single.length} chữ cái): <b>${esc(pat)}</b><br><i>Nghĩa: ${v.vi}</i>`,
        answer:single, accept:[single], explanation:`Đáp án: <b>${single}</b> ${v.ipa}`});
    }
  });
  /* Câu hỏi từ bài tập gốc dạng trắc nghiệm */
  EXERCISES.forEach(e=>{
    if(e.type==='mc'){
      e.items.forEach((it,i)=>{
        pool.push({key:'t-orig-'+e.id+'-'+i, unit:e.unit, type:'mc',
          prompt:it.q, options:it.o.slice(), answer:it.o[it.a],
          explanation:it.ex||`Đáp án: ${it.o[it.a]}`});
      });
    }
    if(e.type==='match'){
      e.pairs.forEach((p,i)=>{
        const others = pick(VOCAB.filter(v=>v.vi!==p.right),3).map(v=>v.vi);
        if(others.length===3){
          pool.push({key:'t-orig-'+e.id+'-m'+i, unit:e.unit, type:'mc',
            prompt:`Từ/cụm từ "<b>${p.left}</b>" có nghĩa là gì?`,
            options: shuffle([p.right].concat(others)), answer:p.right,
            explanation:`"${p.left}" = ${p.right}`});
        }
      });
    }
    if(e.type==='fill'){
      e.items.forEach((it,i)=>{
        pool.push({key:'t-orig-'+e.id+'-f'+i, unit:e.unit, type:'text',
          prompt:it.q, answer:it.a, accept:[it.a],
          explanation: it.ex || `Đáp án: ${it.a}`});
      });
    }
    if(e.type==='complete'){
      e.items.forEach((it,i)=>{
        pool.push({key:'t-orig-'+e.id+'-c'+i, unit:e.unit, type:'text',
          prompt:`${it.hint}<br><span class="note" style="font-family:monospace">${it.pattern}</span>`,
          answer:it.answer, accept:[it.answer], explanation:`Đáp án: <b>${it.answer}</b>`});
      });
    }
    if(e.type==='sort'){
      e.items.forEach((it,i)=>{
        pool.push({key:'t-orig-'+e.id+'-s'+i, unit:e.unit, type:'mc',
          prompt:`Từ "<b>${it.w}</b>" thuộc nhóm nào?`,
          options: e.cats.slice(), answer:it.c,
          explanation:`"${it.w}" thuộc nhóm "${it.c}".`});
      });
    }
  });
  return pool;
}

  <div class="card" id="testSetup">
    <h2>Cấu hình bài kiểm tra</h2>
    <p class="note">Câu hỏi và các lựa chọn sẽ được xáo trộn ngẫu nhiên mỗi lần làm. Đáp án chỉ hiện sau khi bạn nộp bài.</p>
    <div class="row">
      <button class="btn primary" data-count="10">10 câu</button>
      <button class="btn primary" data-count="20">20 câu</button>
      <button class="btn primary" data-count="30">30 câu</button>
      <button class="btn primary" data-count="all">Tất cả câu hỏi</button>
    </div>
    <div id="poolInfo" class="note" style="margin-top:10px"></div>
  </div>
  <div id="testBody"></div>`;

  const pool = buildQuestionPool();
  main.querySelector('#poolInfo').textContent = `Tổng số câu hỏi khách quan hiện có: ${pool.length}.`;
